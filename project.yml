name: DriveClue
options:
  bundleIdPrefix: com.trantuan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  DriveClueCore:
    path: DriveClueCore
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.0
targets:
  DriveClue:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - AppIcon.icns
    resources:
      - path: App/PrivacyInfo.xcprivacy
    dependencies:
      - package: DriveClueCore
        product: DriveClueCore
      - package: Sparkle
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: DriveClue
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        SUFeedURL: https://raw.githubusercontent.com/driveclue/DriveClue/main/appcast.xml
        SUPublicEDKey: mwTWSAi4FYAOlIGHncqA8MniPfH5V9Kra9bDqfoGeZI=
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.trantuan.driveclue
        PRODUCT_NAME: DriveClue
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: R3YX83R9RQ
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          # Distribution builds sign with Developer ID for Gatekeeper/notarization;
          # automatic signing only allows development identities.
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          DEVELOPMENT_TEAM: R3YX83R9RQ
scheme:
  DriveClue:
    build:
      targets:
        DriveClue: all
