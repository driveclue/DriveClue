<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20618F"/>
      <stop offset="0.55" stop-color="#14406B"/>
      <stop offset="1" stop-color="#0C2846"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7DCF0"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3DDC7A"/>
      <stop offset="1" stop-color="#27C063"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#001325" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- drive body -->
  <g filter="url(#ds)">
    <rect x="228" y="468" width="396" height="248" rx="46" fill="url(#metal)"/>
  </g>
  <rect x="272" y="646" width="132" height="24" rx="12" fill="#0E2A47" opacity="0.22"/>
  <circle cx="576" cy="658" r="15" fill="#2FA84F"/>

  <!-- magnifier -->
  <g filter="url(#ds)">
    <line x1="708" y1="533" x2="828" y2="653" stroke="#FFFFFF" stroke-width="54" stroke-linecap="round"/>
    <circle cx="600" cy="425" r="150" fill="#8CC8FF" fill-opacity="0.28" stroke="#FFFFFF" stroke-width="42"/>
  </g>
  <ellipse cx="538" cy="352" rx="58" ry="24" fill="#FFFFFF" opacity="0.45" transform="rotate(-32 538 352)"/>
  <!-- health pulse inside the lens -->
  <polyline points="508,448 560,448 582,396 614,500 638,448 692,448" fill="none" stroke="url(#pulse)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
