<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20618F"/>
      <stop offset="0.55" stop-color="#14406B"/>
      <stop offset="1" stop-color="#0C2846"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C7DCF0"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#001325" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- signal arcs -->
  <g fill="none" stroke="#FFFFFF" stroke-width="38" stroke-linecap="round">
    <path d="M 594.7 546.6 A 108 108 0 0 0 429.3 546.6" opacity="1"/>
    <path d="M 654.5 496.4 A 186 186 0 0 0 369.5 496.4" opacity="0.6"/>
    <path d="M 714.2 446.2 A 264 264 0 0 0 309.8 446.2" opacity="0.32"/>
  </g>

  <!-- drive -->
  <g filter="url(#ds)">
    <rect x="398" y="616" width="228" height="104" rx="34" fill="url(#metal)"/>
  </g>
  <rect x="430" y="654" width="100" height="24" rx="12" fill="#0E2A47" opacity="0.22"/>
  <circle cx="586" cy="666" r="14" fill="#2FA84F"/>
</svg>
