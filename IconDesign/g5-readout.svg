<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35B374"/>
      <stop offset="0.55" stop-color="#1F8E56"/>
      <stop offset="1" stop-color="#0E6240"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D2EFE0"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#012F1C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- drive hero -->
  <g filter="url(#ds)">
    <rect x="272" y="372" width="480" height="280" rx="60" fill="url(#metal)"/>
  </g>
  <!-- analytics screen -->
  <rect x="332" y="428" width="290" height="170" rx="26" fill="#0E2A47"/>
  <rect x="374" y="522" width="34" height="44" rx="10" fill="#3DDC7A"/>
  <rect x="430" y="490" width="34" height="76" rx="10" fill="#3DDC7A"/>
  <rect x="486" y="458" width="34" height="108" rx="10" fill="#3DDC7A"/>
  <!-- status details -->
  <circle cx="682" cy="552" r="15" fill="#17A967"/>
  <rect x="640" y="600" width="84" height="22" rx="11" fill="#0E2A47" opacity="0.15"/>
</svg>
