<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35B374"/>
      <stop offset="0.55" stop-color="#1F8E56"/>
      <stop offset="1" stop-color="#0E6240"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CDEBDB"/>
    </linearGradient>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="4.5" fill="#FFFFFF" fill-opacity="0.13"/>
    </pattern>
    <clipPath id="sq"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#012F1C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <g clip-path="url(#sq)">
    <rect x="100" y="100" width="824" height="824" fill="url(#dots)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- storage drive hero -->
  <g transform="translate(0,6)">
    <rect x="212" y="612" width="520" height="78" rx="39" fill="#8FC7AC"/>
    <g filter="url(#ds)">
      <rect x="212" y="430" width="520" height="230" rx="48" fill="url(#metal)"/>
    </g>
    <g fill="#0E6240" opacity="0.25">
      <rect x="262" y="476" width="78" height="18" rx="9"/>
      <rect x="262" y="512" width="78" height="18" rx="9"/>
      <rect x="262" y="548" width="78" height="18" rx="9"/>
    </g>
    <rect x="706" y="522" width="26" height="22" rx="11" fill="#0E6240" opacity="0.4"/>
    <circle cx="664" cy="588" r="30" fill="#35E07F" opacity="0.28"/>
    <circle cx="664" cy="588" r="15" fill="#21C46D"/>
  </g>

  <!-- diagnostic lens over the top-right corner -->
  <g filter="url(#ds)">
    <line x1="756" y1="446" x2="806" y2="496" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round"/>
    <circle cx="700" cy="390" r="76" fill="#0C4A33" stroke="#FFFFFF" stroke-width="20"/>
  </g>
  <polyline points="664,396 680,396 692,370 712,422 724,396 740,396" fill="none" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
