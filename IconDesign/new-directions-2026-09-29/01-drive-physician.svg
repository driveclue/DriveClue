<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#33BA78"/><stop offset=".55" stop-color="#158759"/><stop offset="1" stop-color="#07513A"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#F9FFF9"/><stop offset="1" stop-color="#CFE8DC"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#003A29" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect x="72" y="72" width="880" height="880" rx="204" fill="url(#tile)"/>
  <path d="M150 405C198 216 367 130 561 128" fill="none" stroke="#B4FFD3" stroke-opacity=".22" stroke-width="20" stroke-linecap="round"/>
