  <circle cx="512" cy="474" r="148" fill="#0B4435" stroke="#9EE7BE" stroke-width="19"/>
  <circle cx="512" cy="474" r="107" fill="#1C9A65" stroke="#E9FFF1" stroke-width="29"/>
