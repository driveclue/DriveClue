<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#35B374"/>
      <stop offset="0.55" stop-color="#1F8E56"/>
      <stop offset="1" stop-color="#0E6240"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.14"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D2EFE0"/>
    </linearGradient>
    <linearGradient id="pulseOnWhite" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#17A967"/>
      <stop offset="1" stop-color="#0E7A48"/>
    </linearGradient>
    <filter id="ds" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#012F1C" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sheen)"/>

  <!-- drive hero -->
  <g filter="url(#ds)">
    <rect x="272" y="366" width="480" height="292" rx="64" fill="url(#metal)"/>
  </g>
  <rect x="316" y="596" width="110" height="22" rx="11" fill="#0E2A47" opacity="0.15"/>
  <circle cx="688" cy="610" r="15" fill="#17A967"/>
  <!-- vitals -->
  <polyline points="320,512 434,512 484,420 548,604 598,512 704,512" fill="none" stroke="url(#pulseOnWhite)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
